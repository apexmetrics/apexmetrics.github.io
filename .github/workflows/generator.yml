name: Generate 5000 Page Crypto Matrix Network Hub
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository data layer code
        uses: actions/checkout@v4

      - name: Initialize Cloud Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Full 5000 Page Compilation Engine
        run: python saas_factory.py

      - name: Force Commit and Push All Generated Matrix Pages to Web Server
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html sitemap.xml articles/*
          git commit -m "Automated Cloud Build: All 5000 Clean Multi-Wallet Gateway Pages" || exit 0
          git push origin main
          
